name: Build and Push All Services

on:
  push:
    branches:
      - Jasmita
      - main
    paths:
      - 'service-registry/**'
      - 'api-gateway/**'
      - 'user-service/**'
      - 'expense/**'
      - 'budget/**'
      - 'notification-service/**'
      - 'analysis-service/**'
      - 'artha-frontend/**'
      - '.github/workflows/build-all.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: service-registry
            path: ./service-registry
          - name: api-gateway
            path: ./api-gateway
          - name: user-service
            path: ./user-service
          - name: expense-service
            path: ./expense
          - name: budget-service
            path: ./budget
          - name: notification-service
            path: ./notification-service
          - name: analysis-service
            path: ./analysis-service
          - name: artha-frontend
            path: ./artha-frontend

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Short Git SHA
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Repository Name
        id: prep
        run: |
          echo "repo=$(echo "ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.path }}
          file: ${{ matrix.service.path }}/Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.repo }}:latest
            ${{ steps.prep.outputs.repo }}:${{ steps.vars.outputs.sha_short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            ${{ matrix.service.name == 'artha-frontend' && 'VITE_API_BASE_URL=https://api.artha.systems' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
