name: Deploy Service Registry

on:
  push:
    branches:
      - Jasmita
      - main
    paths:
      - 'service-registry/**'
      - '.github/workflows/deploy-registry.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
      image_repository: ${{ steps.prep.outputs.repo }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Short Git SHA
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Repository Name
        id: prep
        run: |
          echo "repo=$(echo "ghcr.io/${{ github.repository_owner }}/service-registry" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./service-registry
          file: ./service-registry/Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.repo }}:latest
            ${{ steps.prep.outputs.repo }}:${{ steps.vars.outputs.sha_short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,docker-compose.infra.yml"
          target: "/opt/artha"

      - name: SSH and deploy service-registry
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Ensure deployment folder exists
            mkdir -p /opt/artha
            cd /opt/artha
            
            # Authenticate with GHCR
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            
            # Pull the new specific SHA image
            docker pull ${{ needs.build-and-push.outputs.image_repository }}:${{ needs.build-and-push.outputs.sha_short }}
            
            # Run docker compose using the new image tag
            IMAGE_TAG=${{ needs.build-and-push.outputs.sha_short }} docker compose up -d --no-deps service-registry
            
            # Verify container status
            docker ps | grep artha-service-registry
            
            # Clean up unused Docker images to save space
            docker image prune -f
